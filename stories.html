<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PDF Selector</title>
        <link rel="stylesheet" href="style.css">
    </head>
        <body id="writing-archive">
            <select id="pdfPicker">
                <option value="0" selected>
                    none
                </option>
                <option value="jeden Edward Wojciechowski.pdf">
                    jeden Edward Wojciechowski
                </option>
                <option value="the one Edward Wojciechowski.pdf">
                    the one Edward Wojciechowski
                </option>
                <option value="Remmick Jones and Erick.pdf">
                    Remmick Jones and Erick
                </option>
        </select>

        <button id="openPdf">Open PDF</button>
        <div id="viewerContainer"></div>

        <script>
            const picker = document.getElementById("pdfPicker");
            const container = document.getElementById("viewerContainer");

            function loadPdf(pdfPath) {
                container.innerHTML = "";

                const iframe = document.createElement("iframe");
                iframe.src = pdfPath;

                container.appendChild(iframe);

                // Fallback download link
                const downloadLink = document.createElement("a");
                downloadLink.href = pdfPath;
                downloadLink.download = "";
                downloadLink.textContent = "Download PDF";
                downloadLink.style.display = "block";
                downloadLink.style.marginTop = "10px";

                container.appendChild(downloadLink);
            }

            document.getElementById("openPdf").addEventListener("click", () => {
                if (picker.value === "0") {
                    console.log("nothing selected");
                } else {
                    loadPdf(picker.value);
                }
            });
        </script>
    </body>
</html>
